name: Supabase keepalive

on:
  schedule:
    # Three database queries each day, away from the top of the hour (UTC).
    - cron: "17 6 * * *"
    - cron: "43 14 * * *"
    - cron: "29 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call isolated Supabase keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          if [ "${SUPABASE_URL%/}" != "https://dddojedzyrcjqasyomso.supabase.co" ]; then
            echo "::error::SUPABASE_URL does not match the MRP Portfolio project."
            exit 1
          fi

          # Refuse privileged keys. Never print or persist the credential.
          if ! python3 -c '
          import base64, json, os, sys
          key = os.environ["SUPABASE_ANON_KEY"]
          if key.startswith("sb_publishable_"):
              sys.exit(0)
          try:
              payload = key.split(".")[1]
              role = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4))).get("role")
              sys.exit(0 if role == "anon" else 1)
          except Exception:
              sys.exit(1)
          '; then
            echo "::error::Use only the public anon or publishable key, never service_role or a secret key."
            exit 1
          fi

          headers=(--header "apikey: ${SUPABASE_ANON_KEY}")
          if [[ "${SUPABASE_ANON_KEY}" != sb_publishable_* ]]; then
            headers+=(--header "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          response="$(
            curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 25 \
              --retry 2 --retry-delay 5 --retry-max-time 90 --retry-connrefused \
              --request POST \
              "${headers[@]}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "${SUPABASE_URL%/}/rest/v1/rpc/keepalive"
          )"

          # The RPC must return a fresh UTC database timestamp, not just HTTP 200.
          if ! jq -e '
            type == "object" and .ok == true and
            (.checked_at | type == "string" and
              test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|\\+00:00)$")) and
            (.checked_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") |
              fromdateiso8601 | . >= (now - 300) and . <= (now + 60))
          ' <<< "${response}" >/dev/null 2>&1; then
            echo "::error::The keepalive RPC did not confirm a fresh database query. Check project status and supabase/keepalive.sql."
            exit 1
          fi

          checked_at="$(jq -r '.checked_at' <<< "${response}")"
          echo "Supabase keepalive completed successfully."
          echo "Database confirmation (UTC): ${checked_at}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### MRP Portfolio maintenance\n\nDatabase query confirmed at %s (UTC). No portfolio data was accessed.\n' "${checked_at}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Explain a failed maintenance check
        if: failure()
        run: |
          echo "::error::Maintenance could not be confirmed. If Supabase is paused, resume mrp-Portfolio Finance in its Dashboard and rerun this workflow. This workflow cannot resume a paused project."
          printf '### Maintenance needs attention\n\nInspect the failed step. If paused, resume mrp-Portfolio Finance in Supabase and wait for Healthy, then rerun this workflow. Never grant service_role or access to portfolio tables.\n' >> "${GITHUB_STEP_SUMMARY}"
